name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: OpenXR and Quest C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/openxr-core-test.sh
      - run: sh scripts/quest-layer-test.sh

  android:
    name: Android builds and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools ndk;29.0.14206865 cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.5.1
      - name: Phone, tablet and XR
        run: gradle --no-watch-fs -p native/android-xr testDebugUnitTest lintDebug assembleDebug
      - name: Google TV
        run: gradle --no-watch-fs -p native/google-tv testDebugUnitTest lintDebug assembleDebug
      - name: Android XR SceneCore
        run: OPENSTREAM_ANDROID_XR_BUILD_DIR="$RUNNER_TEMP/openstream-android-xr-scene" gradle --no-watch-fs -p native/android-xr-scene testDebugUnitTest lintDebug assembleDebug
      - name: Meta Quest OpenXR
        run: OPENSTREAM_QUEST_BUILD_DIR="$RUNNER_TEMP/openstream-meta-quest" gradle --no-watch-fs -p native/meta-quest lintDebug assembleDebug
