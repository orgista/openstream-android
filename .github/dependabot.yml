version: 2
updates:
  - package-ecosystem: gradle
    directories: [/native/android-xr, /native/google-tv, /native/android-xr-scene, /native/meta-quest]
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
